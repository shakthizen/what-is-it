name: Publish Package to npm

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: 'npm distribution tag (default: latest)'
        required: true
        default: 'latest'
      otp:
        description: '6-digit npm 2FA OTP code (if not using an Automation token)'
        required: false
        default: ''

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Run automated tests
        run: pnpm test

      - name: Build Web and CLI
        run: pnpm build

      - name: Publish to npm
        run: |
          OTP_FLAG=""
          if [ -n "${{ github.event.inputs.otp }}" ]; then
            OTP_FLAG="--otp=${{ github.event.inputs.otp }}"
          fi
          npm publish --access public --tag ${{ github.event.inputs.tag || 'latest' }} $OTP_FLAG
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
