name: Publish Package to npm

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: 'npm distribution tag (default: latest)'
        required: true
        default: 'latest'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    # Must match the "Environment name" configured on this package's Trusted
    # Publisher entry on npmjs.com (shakthizen/what-is-it -> publish.yml -> NPM_TOKEN)
    # exactly, or npm can't match this job's OIDC token to that config and
    # publish fails (404 / ENEEDAUTH) even with id-token: write set correctly.
    environment: NPM_TOKEN
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Run automated tests
        run: pnpm test

      - name: Build Web and CLI
        run: pnpm build

      # Trusted Publishing (OIDC) requires npm 11.5.1+; actions/setup-node's bundled
      # npm may be older, so pin it explicitly rather than relying on Node 22's default.
      - name: Ensure npm supports OIDC trusted publishing
        run: npm install -g npm@latest

      # No NODE_AUTH_TOKEN / NPM_TOKEN here on purpose: this package has a Trusted
      # Publisher configured on npm (shakthizen/what-is-it -> publish.yml), so npm
      # exchanges this job's OIDC id-token for a short-lived publish credential
      # instead of requiring a static secret or a 2FA one-time password.
      - name: Publish to npm via OIDC trusted publisher
        run: npm publish --access public --tag ${{ github.event.inputs.tag || 'latest' }}
